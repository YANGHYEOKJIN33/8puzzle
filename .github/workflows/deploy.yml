# GitHub Pages 자동 배포 (요구사항 7.1)
# main 브랜치에 push하면 저장소 내용을 그대로 정적 사이트로 게시한다.
# 빌드 도구가 없으므로 별도의 컴파일 단계가 필요 없다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 게시에 필요한 최소 권한만 준다
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages가 아직 켜져 있지 않으면 이 워크플로가 직접 켠다.
          # (없으면 "Get Pages site failed ... Not Found" 로 실패한다)
          enablement: true

      - name: 사이트 파일 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
